<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Darwin Admin</title>
<meta name="theme-color" content="#15231e" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
<script>
  // La taxonomie Excel est à la racine du site, pas dans admin/.
  window.FICHES_TAXONOMY_URL = "../data/taxonomie.xlsx";
  // Round 68 : Darwin Admin charge toujours la dernière version de ses
  // fichiers (paramètre ?v= différent à chaque ouverture) — sinon le
  // navigateur pouvait garder l'ancienne version plusieurs minutes après
  // une mise en ligne. Chargement dans l'ordre, comme des balises normales.
  window.__ADMIN_V = String(Date.now());
  window.__adminLoad = function (src) {
    document.write('<script src="' + src + "?v=" + window.__ADMIN_V + '"><\/script>');
  };
  document.write('<link rel="stylesheet" href="admin.css?v=' + window.__ADMIN_V + '" />');
  window.__adminLoad("../js/config.js");
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  window.__adminLoad("../js/settings-model.js");
  window.__adminLoad("../js/taxonomy.js");
</script>
</head>
<body>
  <!-- Écran de chargement / connexion / accès refusé -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="brand brand--dark"><span class="brand-logo" aria-hidden="true"></span><span class="brand-name">darwin</span><span class="brand-tag">Admin</span></div>
      <div id="gate-loading" class="gate-msg">Chargement…</div>
      <form id="login-form" class="login-form" hidden>
        <h1 class="gate-title">Connexion</h1>
        <p class="muted">Utilise le même compte que dans l'appli Fiches. Seuls les comptes administrateurs ont accès à cette appli.</p>
        <label class="field"><span>Email</span><input type="email" id="login-email" autocomplete="username" required /></label>
        <label class="field"><span>Mot de passe</span><input type="password" id="login-password" autocomplete="current-password" required /></label>
        <p class="form-error" id="login-error" hidden></p>
        <button type="submit" class="btn btn--primary btn--block" id="login-submit">Se connecter</button>
      </form>
      <div id="gate-denied" hidden>
        <h1 class="gate-title">Accès réservé</h1>
        <p class="muted" id="gate-denied-text">Ce compte n'est pas administrateur.</p>
        <button type="button" class="btn btn--block" id="gate-logout">Changer de compte</button>
      </div>
    </div>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#/dashboard"><span class="brand-logo" aria-hidden="true"></span><span class="brand-name">darwin</span><span class="brand-tag">Admin</span></a>
      </div>
      <nav class="nav" id="nav" aria-label="Menu principal"></nav>
      <div class="sidebar-foot">
        <a class="sidebar-link" href="../" target="_blank" rel="noopener">Ouvrir l'appli Fiches ↗</a>
        <div class="sidebar-user" id="sidebar-user"></div>
        <button type="button" class="sidebar-logout" id="logout-btn">Se déconnecter</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div class="topbar-titles">
          <div class="crumbs" id="crumbs"></div>
          <h1 class="page-title" id="page-title"></h1>
        </div>
        <div class="save-state" id="save-state" hidden></div>
      </header>
      <div class="notice" id="notice" hidden></div>
      <main class="main" id="main">
        <div class="page" id="page"></div>
        <aside class="preview" id="preview" hidden></aside>
      </main>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 class="modal-title" id="modal-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script>window.__adminLoad("admin.js");</script>
</body>
</html>
